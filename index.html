<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<style>
:root {
  --bg: #0b0b0f;
  --sidebar: #121218;
  --card: #18181f;
  --border: #2a2a35;
  --text: #eee;
  --muted: #888;
  --accent: #7c6bff;
  --accent-hover: #6a58e8;
  --radius: 12px;
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="dark"] {
  --bg: #0b0b0f;
  --sidebar: #121218;
  --card: #18181f;
  --border: #2a2a35;
  --text: #eee;
  --muted: #888;
  --accent: #7c6bff;
}

[data-theme="midnight"] {
  --bg: #0a0e17;
  --sidebar: #0f1520;
  --card: #151c2c;
  --border: #1e2a3a;
  --text: #e8eef7;
  --muted: #7a8ba3;
  --accent: #3b82f6;
}

[data-theme="ember"] {
  --bg: #140c0c;
  --sidebar: #1a1010;
  --card: #221616;
  --border: #3a2424;
  --text: #ffe8e8;
  --muted: #a88;
  --accent: #ff5c5c;
}

[data-theme="forest"] {
  --bg: #0c140f;
  --sidebar: #101a14;
  --card: #16221a;
  --border: #243a2c;
  --text: #e8ffe8;
  --muted: #8aa;
  --accent: #4ade80;
}

[data-theme="light"] {
  --bg: #f4f4f8;
  --sidebar: #ffffff;
  --card: #ffffff;
  --border: #e0e0e8;
  --text: #111;
  --muted: #666;
  --accent: #6c5ce7;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Inter, system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  min-height: 100vh;
  overflow-x: hidden;
  transition: background var(--transition), color var(--transition);
}

body.no-motion * {
  transition: none !important;
  animation: none !important;
}

.sidebar {
  width: 230px;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  height: 100vh;
  position: fixed;
  left: 0;
  top: 0;
  display: flex;
  flex-direction: column;
  z-index: 100;
  transition: transform var(--transition);
}

.logo {
  padding: 24px 20px 20px;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo span {
  background: linear-gradient(135deg, var(--accent), #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.nav {
  flex: 1;
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.nav-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 14.5px;
  border-radius: 10px;
  cursor: pointer;
  transition: all var(--transition);
  text-align: left;
  width: 100%;
}

.nav-btn:hover {
  background: color-mix(in srgb, var(--accent) 12%, transparent);
  color: var(--text);
}

.nav-btn.active {
  background: color-mix(in srgb, var(--accent) 18%, transparent);
  color: var(--accent);
  font-weight: 500;
}

.nav-btn svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

.sidebar-footer {
  padding: 16px;
  border-top: 1px solid var(--border);
}

.main {
  margin-left: 230px;
  flex: 1;
  padding: 32px 40px;
  min-height: 100vh;
}

.page {
  display: none;
  animation: fadeIn 0.25s ease;
}

.page.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.header {
  margin-bottom: 28px;
}

.header h1 {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.5px;
  margin-bottom: 6px;
}

.header p {
  color: var(--muted);
  font-size: 14.5px;
}

.search-wrap {
  position: relative;
  max-width: 420px;
  margin-bottom: 28px;
}

.search-wrap input {
  width: 100%;
  padding: 13px 16px 13px 44px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-size: 15px;
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}

.search-wrap input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
}

.search-wrap svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: var(--muted);
  pointer-events: none;
}

.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 18px;
}

.game-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: all var(--transition);
  position: relative;
}

.game-card:hover {
  transform: translateY(-5px);
  border-color: var(--accent);
  box-shadow: 0 12px 24px -8px color-mix(in srgb, var(--accent) 30%, transparent);
}

.game-card img {
  width: 100%;
  height: 110px;
  object-fit: cover;
  background: #1a1a22;
  display: block;
}

.game-card .info {
  padding: 12px 14px;
}

.game-card .name {
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.game-card .badge {
  position: absolute;
  top: 8px;
  right: 8px;
  background: color-mix(in srgb, var(--accent) 90%, black);
  color: white;
  font-size: 10px;
  font-weight: 600;
  padding: 3px 7px;
  border-radius: 6px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.settings-grid {
  display: grid;
  gap: 16px;
  max-width: 560px;
}

.setting-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
}

.setting-card label {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 10px;
  font-weight: 500;
}

.theme-options, .option-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.theme-btn, .opt-btn {
  padding: 9px 16px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  font-size: 13.5px;
  cursor: pointer;
  transition: all var(--transition);
}

.theme-btn:hover, .opt-btn:hover {
  border-color: var(--accent);
}

.theme-btn.active, .opt-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.setting-card input[type="text"] {
  width: 100%;
  padding: 11px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text);
  font-size: 14px;
  outline: none;
}

.setting-card input[type="text"]:focus {
  border-color: var(--accent);
}

.proxy-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 28px;
}

.proxy-box h3 {
  font-size: 15px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.proxy-input-row {
  display: flex;
  gap: 10px;
}

.proxy-input-row input {
  flex: 1;
  padding: 12px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 14px;
  outline: none;
}

.proxy-input-row input:focus {
  border-color: var(--accent);
}

.proxy-input-row button {
  padding: 0 20px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background var(--transition);
}

.proxy-input-row button:hover {
  background: var(--accent-hover);
}

.player-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 200;
  display: none;
  flex-direction: column;
}

.player-overlay.active {
  display: flex;
}

.player-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--sidebar);
  border-bottom: 1px solid var(--border);
}

.player-bar button {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  transition: all var(--transition);
}

.player-bar button:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.player-title {
  flex: 1;
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.player-frame {
  flex: 1;
  border: none;
  width: 100%;
  background: #000;
}

.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--card);
  border: 1px solid var(--border);
  padding: 12px 18px;
  border-radius: 10px;
  font-size: 13.5px;
  z-index: 300;
  animation: slideUp 0.3s ease;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 700px) {
  .sidebar {
    transform: translateX(-100%);
  }
  .sidebar.open {
    transform: translateX(0);
  }
  .main {
    margin-left: 0;
    padding: 20px;
  }
}
</style>
</head>
<body data-theme="dark">

<aside class="sidebar" id="sidebar">
  <div class="logo"><span>arcade</span></div>
  <nav class="nav">
    <button class="nav-btn active" data-page="home">

<script>
const GAMES = [
  { name: "Slope", url: "https://slope.io", badge: "Popular" },
  { name: "1v1.LOL", url: "https://1v1.lol", badge: "Multi" },
  { name: "Retro Bowl", url: "https://retrobowl.me", badge: "Sports" },
  { name: "Cookie Clicker", url: "https://orteil.dashnet.org/cookieclicker/", badge: "Idle" },
  { name: "2048", url: "https://play2048.co", badge: "Puzzle" },
  { name: "Tunnel Rush", url: "https://tunnelrush.io", badge: "Action" },
  { name: "Stack Ball", url: "https://stackball.io", badge: "Arcade" },
  { name: "Geometry Dash", url: "https://geometrydash.io", badge: "Rhythm" },
  { name: "Drift Hunters", url: "https://drift-hunters.co", badge: "Racing" },
  { name: "Basket Random", url: "https://basketrandom.io", badge: "Sports" },
  { name: "Moto X3M", url: "https://motox3m.io", badge: "Racing" },
  { name: "Happy Wheels", url: "https://totaljerkface.com/happy_wheels.tjf", badge: "Classic" },
  { name: "Run 3", url: "https://run3.io", badge: "Arcade" },
  { name: "Crossy Road", url: "https://crossyroad.io", badge: "Arcade" },
  { name: "Flappy Bird", url: "https://flappybird.io", badge: "Classic" },
  { name: "Subway Surfers", url: "https://subwaysurfers.io", badge: "Runner" }
];

const CLOAKS = {
  Games: { title: "Games", favicon: null },
  Google: { title: "Google", favicon: "https://www.google.com/favicon.ico" },
  Classroom: { title: "Classes", favicon: "https://ssl.gstatic.com/classroom/favicon.ico" },
  Drive: { title: "My Drive - Google Drive", favicon: "https://ssl.gstatic.com/docs/doclist/images/drive_2022q3_32dp.png" },
  Docs: { title: "Document", favicon: "https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico" }
};

const PROXY_BASE = "https://uv.holyubofficial.net/service/";

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let currentUrl = "";

function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function save(key, val) {
  localStorage.setItem("arcade_" + key, val);
}

function load(key, fallback) {
  return localStorage.getItem("arcade_" + key) || fallback;
}

function setTheme(name) {
  document.body.dataset.theme = name;
  save("theme", name);
  $$(".theme-btn").forEach(b => b.classList.toggle("active", b.dataset.theme === name));
}

function setCloak(name) {
  const c = CLOAKS[name] || CLOAKS.Games;
  document.title = c.title;
  let link = document.querySelector("link[rel*='icon']") || document.createElement("link");
  link.rel = "icon";
  if (c.favicon) link.href = c.favicon;
  else link.href = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>";
  document.head.appendChild(link);
  save("cloak", name);
  $$("[data-cloak]").forEach(b => b.classList.toggle("active", b.dataset.cloak === name));
}

function setMotion(on) {
  document.body.classList.toggle("no-motion", !on);
  save("motion", on ? "on" : "off");
  $$("[data-motion]").forEach(b => b.classList.toggle("active", b.dataset.motion === (on ? "on" : "off")));
}

function showPage(id) {
  $$(".page").forEach(p => p.classList.remove("active"));
  $("#" + id).classList.add("active");
  $$(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.page === id));
}

function cardHTML(g) {
  const img = `https://via.placeholder.com/160x110/1a1a22/7c6bff?text=${encodeURIComponent(g.name)}`;
  return `
    <div class="game-card" data-url="${g.url}" data-name="${g.name}">
      ${g.badge ? `<span class="badge">${g.badge}</span>` : ""}
      <img src="${img}" alt="${g.name}" loading="lazy">
      <div class="info"><div class="name">${g.name}</div></div>
    </div>`;
}

function renderGames(list, target) {
  $(target).innerHTML = list.map(cardHTML).join("");
  $$(target + " .game-card").forEach(card => {
    card.onclick = () => openPlayer(card.dataset.url, card.dataset.name);
  });
}

function filterGames(q, target) {
  const filtered = GAMES.filter(g => g.name.toLowerCase().includes(q.toLowerCase()));
  renderGames(filtered, target);
}

function openPlayer(url, title) {
  currentUrl = url;
  $("#player-title").textContent = title || url;
  $("#player-frame").src = url;
  $("#player").classList.add("active");
}

function closePlayer() {
  $("#player").classList.remove("active");
  $("#player-frame").src = "about:blank";
}

function openProxy(url) {
  if (!url.startsWith("http")) url = "https://" + url;
  const proxied = PROXY_BASE + encodeURIComponent(url);
  openPlayer(proxied, url);
}

function panic() {
  const dest = $("#panic-url").value || "https://classroom.google.com";
  window.location.href = dest;
}

function init() {
  const theme = load("theme", "dark");
  const cloak = load("cloak", "Games");
  const motion = load("motion", "on");
  const panicUrl = load("panicUrl", "https://classroom.google.com");
  const siteName = load("siteName", "arcade");

  setTheme(theme);
  setCloak(cloak);
  setMotion(motion === "on");
  $("#panic-url").value = panicUrl;
  $("#site-name").value = siteName;
  $(".logo span").textContent = siteName;

  renderGames(GAMES.slice(0, 8), "#home-grid");
  renderGames(GAMES, "#games-grid");

  $$(".nav-btn[data-page]").forEach(btn => {
    btn.onclick = () => showPage(btn.dataset.page);
  });

  $("#home-search").oninput = e => filterGames(e.target.value, "#home-grid");
  $("#games-search").oninput = e => filterGames(e.target.value, "#games-grid");

  $$(".theme-btn").forEach(b => b.onclick = () => setTheme(b.dataset.theme));
  $$("[data-cloak]").forEach(b => b.onclick = () => setCloak(b.dataset.cloak));
  $$("[data-motion]").forEach(b => b.onclick = () => setMotion(b.dataset.motion === "on"));

  $("#panic-url").onchange = e => save("panicUrl", e.target.value);
  $("#site-name").onchange = e => {
    save("siteName", e.target.value);
    $(".logo span").textContent = e.target.value;
  };

  $("#proxy-go").onclick = () => openProxy($("#proxy-url").value);
  $("#proxy-url").onkeydown = e => { if (e.key === "Enter") openProxy(e.target.value); };
  $$("[data-proxy]").forEach(b => b.onclick = () => openProxy(b.dataset.proxy));

  $("#player-back").onclick = closePlayer;
  $("#player-reload").onclick = () => { $("#player-frame").src = currentUrl; };
  $("#player-newtab").onclick = () => window.open(currentUrl, "_blank");
  $("#player-fs").onclick = () => {
    const f = $("#player-frame");
    if (f.requestFullscreen) f.requestFullscreen();
  };

  $("#panic-btn").onclick = panic;
  document.addEventListener("keydown", e => {
    if (e.key === "]" || e.key === "Escape") {
      if (e.key === "]") panic();
    }
  });
}

init();
</script>
</body>
</html>
