<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0c1a2e;
    --glass: rgba(20, 30, 50, 0.55);
    --glass-border: rgba(255,255,255,0.08);
    --text: #ffffff;
    --muted: rgba(255,255,255,0.55);
    --accent: #7dd3fc;
    --radius: 18px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    color: var(--text);
    overflow-x: hidden;
    background: #0c1a2e;
    transition: background 0.6s ease;
  }

  /* Backgrounds */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -2;
    background-size: cover;
    background-position: center;
    transition: opacity 1s ease;
  }

  .bg.mountain {
    background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1920&q=80');
  }
  .bg.forest {
    background-image: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1920&q=80');
  }
  .bg.lake {
    background-image: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1920&q=80');
  }
  .bg.desert {
    background-image: url('https://images.unsplash.com/photo-1509316785289-025f5b846b35?w=1920&q=80');
  }
  .bg.aurora {
    background-image: url('https://images.unsplash.com/photo-1531366936337-7c912a45b4d9?w=1920&q=80');
  }
  .bg.ocean {
    background-image: url('https://images.unsplash.com/photo-1505142468610-359e7d316be0?w=1920&q=80');
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(to bottom, rgba(10,20,40,0.35), rgba(10,20,40,0.55));
    z-index: -1;
  }

  /* Top bar */
  .topbar {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    background: var(--glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 40px;
    padding: 6px 10px;
    z-index: 50;
  }

  .topbar button {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .topbar button:hover,
  .topbar button.active {
    background: rgba(255,255,255,0.12);
    color: white;
  }

  .topbar button svg {
    width: 18px;
    height: 18px;
  }

  .profile {
    position: fixed;
    top: 18px;
    right: 22px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--glass);
    backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 40px;
    padding: 5px 12px 5px 5px;
    font-size: 13px;
    color: white;
    cursor: pointer;
    z-index: 50;
  }

  .profile img {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
  }

  /* Center content */
  .center {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
  }

  .clock {
    font-size: clamp(64px, 12vw, 110px);
    font-weight: 300;
    letter-spacing: -3px;
    line-height: 1;
    margin-bottom: 8px;
  }

  .greeting {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 36px;
    font-weight: 400;
  }

  .search-box {
    display: flex;
    align-items: center;
    background: var(--glass);
    backdrop-filter: blur(18px);
    border: 1px solid var(--glass-border);
    border-radius: 50px;
    padding: 6px 6px 6px 18px;
    width: 100%;
    max-width: 480px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search-box:focus-within {
    border-color: rgba(255,255,255,0.25);
    box-shadow: 0 0 0 3px rgba(125, 211, 252, 0.15);
  }

  .search-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 15px;
    padding: 10px 12px;
  }

  .search-box input::placeholder {
    color: var(--muted);
  }

  .search-box button {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.1);
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .search-box button:hover {
    background: rgba(255,255,255,0.2);
  }

  /* Quick apps */
  .apps {
    display: flex;
    gap: 14px;
    margin-top: 32px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .app {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: var(--glass);
    backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
    color: white;
    font-size: 20px;
  }

  .app:hover {
    transform: translateY(-4px);
    background: rgba(255,255,255,0.15);
  }

  .app.add {
    border-style: dashed;
    opacity: 0.5;
  }

  /* Pages */
  .page {
    display: none;
    min-height: 100vh;
    padding: 90px 40px 40px;
  }

  .page.active {
    display: block;
  }

  .page-title {
    font-size: 28px;
    font-weight: 500;
    margin-bottom: 8px;
  }

  .page-sub {
    color: var(--muted);
    margin-bottom: 28px;
    font-size: 14px;
  }

  /* Games grid */
  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
  }

  .game-card {
    background: var(--glass);
    backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s;
  }

  .game-card:hover {
    transform: translateY(-4px);
    border-color: rgba(255,255,255,0.2);
  }

  .game-card img {
    width: 100%;
    height: 100px;
    object-fit: cover;
    background: rgba(0,0,0,0.3);
  }

  .game-card .name {
    padding: 12px;
    font-size: 13.5px;
    font-weight: 500;
  }

  /* Settings */
  .settings-grid {
    display: grid;
    gap: 16px;
    max-width: 520px;
  }

  .setting {
    background: var(--glass);
    backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 18px 20px;
  }

  .setting label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .options {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .opt {
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid var(--glass-border);
    background: transparent;
    color: white;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .opt:hover, .opt.active {
    background: rgba(255,255,255,0.15);
    border-color: rgba(255,255,255,0.25);
  }

  .setting input[type="text"] {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--glass-border);
    background: rgba(0,0,0,0.25);
    color: white;
    font-size: 14px;
    outline: none;
  }

  /* Player */
  .player {
    position: fixed;
    inset: 0;
    background: #0a0a0f;
    z-index: 100;
    display: none;
    flex-direction: column;
  }

  .player.active { display: flex; }

  .player-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: rgba(20,25,40,0.95);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .player-bar button {
    background: rgba(255,255,255,0.08);
    border: none;
    color: white;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }

  .player-bar button:hover {
    background: rgba(255,255,255,0.15);
  }

  .player-title {
    flex: 1;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .player iframe {
    flex: 1;
    border: none;
    width: 100%;
  }

  @media (max-width: 600px) {
    .clock { font-size: 64px; }
    .page { padding: 80px 20px 30px; }
  }
</style>
</head>
<body>

<div class="bg mountain" id="bg"></div>
<div class="overlay"></div>

<!-- Top Navigation -->
<nav class="topbar">
  <button class="active" data-page="home" title="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
  </button>
  <button data-page="games" title="Games">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><line x1="6" y1="12" x2="10"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="16" cy="11" r="1"/><circle cx="18" cy="13" r="1"/></svg>
  </button>
  <button data-page="proxy" title="Proxy">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
  </button>
  <button data-page="settings" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</nav>

<div class="profile" id="profile">
  <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=atm" alt="">
  <span id="username">atm</span>
</div>

<!-- HOME -->
<section id="home" class="page active">
  <div class="center">
    <div class="clock" id="clock">00:00</div>
    <div class="greeting" id="greeting">good afternoon</div>

    <div class="search-box">
      <input type="text" id="search" placeholder="search or enter url" autocomplete="off">
      <button id="go-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>

    <div class="apps" id="apps">
      <div class="app" data-url="https://youtube.com" title="YouTube">▶</div>
      <div class="app" data-url="https://github.com" title="GitHub">⌥</div>
      <div class="app" data-url="https://chat.openai.com" title="ChatGPT">✦</div>
      <div class="app" data-url="https://discord.com/app" title="Discord">💬</div>
      <div class="app" data-url="https://open.spotify.com" title="Spotify">♪</div>
      <div class="app add" title="Add">+</div>
    </div>
  </div>
</section>

<!-- GAMES -->
<section id="games" class="page">
  <div class="page-title">Games</div>
  <div class="page-sub">click any game to play</div>
  <div class="games-grid" id="games-grid"></div>
</section>

<!-- PROXY -->
<section id="proxy" class="page">
  <div class="page-title">Proxy</div>
  <div class="page-sub">browse any website</div>
  <div class="search-box" style="max-width:520px; margin-bottom:24px;">
    <input type="text" id="proxy-input" placeholder="https://example.com" value="https://">
    <button id="proxy-go">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
  </div>
  <div class="apps">
    <div class="app" data-proxy="https://google.com">G</div>
    <div class="app" data-proxy="https://youtube.com">▶</div>
    <div class="app" data-proxy="https://reddit.com">R</div>
    <div class="app" data-proxy="https://twitter.com">X</div>
    <div class="app" data-proxy="https://tiktok.com">T</div>
  </div>
</section>

<!-- SETTINGS -->
<section id="settings" class="page">
  <div class="page-title">Settings</div>
  <div class="page-sub">make it yours</div>

  <div class="settings-grid">
    <div class="setting">
      <label>Background</label>
      <div class="options">
        <button class="opt active" data-bg="mountain">Mountains</button>
        <button class="opt" data-bg="forest">Forest</button>
        <button class="opt" data-bg="lake">Lake</button>
        <button class="opt" data-bg="desert">Desert</button>
        <button class="opt" data-bg="aurora">Aurora</button>
        <button class="opt" data-bg="ocean">Ocean</button>
      </div>
    </div>

    <div class="setting">
      <label>Username</label>
      <input type="text" id="name-input" value="atm">
    </div>

    <div class="setting">
      <label>Panic Key Destination</label>
      <input type="text" id="panic-url" value="https://classroom.google.com">
    </div>

    <div class="setting">
      <label>Tab Cloak</label>
      <div class="options">
        <button class="opt active" data-cloak="Home">None</button>
        <button class="opt" data-cloak="Google">Google</button>
        <button class="opt" data-cloak="Classroom">Classroom</button>
        <button class="opt" data-cloak="Drive">Drive</button>
      </div>
    </div>
  </div>
</section>

<!-- Player -->
<div class="player" id="player">
  <div class="player-bar">
    <button id="back-btn">← Back</button>
    <div class="player-title" id="player-title">Loading...</div>
    <button id="reload-btn">Reload</button>
    <button id="newtab-btn">New Tab</button>
  </div>
  <iframe id="frame" allowfullscreen></iframe>
</div>

<script>
const GAMES = [
  { name: "Slope", url: "https://slope.io" },
  { name: "1v1.LOL", url: "https://1v1.lol" },
  { name: "Retro Bowl", url: "https://retrobowl.me" },
  { name: "Cookie Clicker", url: "https://orteil.dashnet.org/cookieclicker/" },
  { name: "2048", url: "https://play2048.co" },
  { name: "Tunnel Rush", url: "https://tunnelrush.io" },
  { name: "Stack Ball", url: "https://stackball.io" },
  { name: "Geometry Dash", url: "https://geometrydash.io" },
  { name: "Drift Hunters", url: "https://drift-hunters.co" },
  { name: "Moto X3M", url: "https://motox3m.io" },
  { name: "Run 3", url: "https://run3.io" },
  { name: "Basket Random", url: "https://basketrandom.io" }
];

const PROXY = "https://uv.holyubofficial.net/service/";
const CLOAKS = {
  Home: { title: "Home", icon: null },
  Google: { title: "Google", icon: "https://www.google.com/favicon.ico" },
  Classroom: { title: "Classes", icon: "https://ssl.gstatic.com/classroom/favicon.ico" },
  Drive: { title: "My Drive", icon: "https://ssl.gstatic.com/docs/doclist/images/drive_2022q3_32dp.png" }
};

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
let current = "";

function save(k, v) { localStorage.setItem("nat_" + k, v); }
function load(k, f) { return localStorage.getItem("nat_" + k) || f; }

function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, "0");
  const m = String(now.getMinutes()).padStart(2, "0");
  $("#clock").textContent = `${h}:${m}`;

  const hour = now.getHours();
  let greet = "good evening";
  if (hour < 12) greet = "good morning";
  else if (hour < 18) greet = "good afternoon";

  const days = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
  const months = ["january","february","march","april","may","june","july","august","september","october","november","december"];
  const day = days[now.getDay()];
  const date = now.getDate();
  const month = months[now.getMonth()];

  $("#greeting").textContent = `${greet} · ${day} ${date} ${month}`;
}

function setBg(name) {
  const bg = $("#bg");
  bg.className = "bg " + name;
  save("bg", name);
  $$("[data-bg]").forEach(b => b.classList.toggle("active", b.dataset.bg === name));
}

function setCloak(name) {
  const c = CLOAKS[name] || CLOAKS.Home;
  document.title = c.title;
  let link = document.querySelector("link[rel*='icon']") || document.createElement("link");
  link.rel = "icon";
  link.href = c.icon || "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔️</text></svg>";
  document.head.appendChild(link);
  save("cloak", name);
  $$("[data-cloak]").forEach(b => b.classList.toggle("active", b.dataset.cloak === name));
}

function showPage(id) {
  $$(".page").forEach(p => p.classList.remove("active"));
  $("#" + id).classList.add("active");
  $$(".topbar button").forEach(b => b.classList.toggle("active", b.dataset.page === id));
}

function openPlayer(url, title) {
  current = url;
  $("#player-title").textContent = title || url;
  $("#frame").src = url;
  $("#player").classList.add("active");
}

function closePlayer() {
  $("#player").classList.remove("active");
  $("#frame").src = "about:blank";
}

function openProxy(url) {
  if (!url.startsWith("http")) url = "https://" + url;
  openPlayer(PROXY + encodeURIComponent(url), url);
}

function renderGames() {
  $("#games-grid").innerHTML = GAMES.map(g => `
    <div class="game-card" data-url="${g.url}" data-name="${g.name}">
      <img src="https://via.placeholder.com/150x100/1a2a3a/7dd3fc?text=${encodeURIComponent(g.name)}" alt="">
      <div class="name">${g.name}</div>
    </div>
  `).join("");

  $$("#games-grid .game-card").forEach(c => {
    c.onclick = () => openPlayer(c.dataset.url, c.dataset.name);
  });
}

function handleSearch(val) {
  if (!val.trim()) return;
  if (val.includes(".") || val.startsWith("http")) {
    openProxy(val);
  } else {
    openProxy("https://www.google.com/search?q=" + encodeURIComponent(val));
  }
}

function init() {
  updateClock();
  setInterval(updateClock, 1000);

  const bg = load("bg", "mountain");
  const cloak = load("cloak", "Home");
  const name = load("name", "atm");
  const panic = load("panic", "https://classroom.google.com");

  setBg(bg);
  setCloak(cloak);
  $("#username").textContent = name;
  $("#name-input").value = name;
  $("#panic-url").value = panic;

  renderGames();

  $$(".topbar button").forEach(b => {
    b.onclick = () => showPage(b.dataset.page);
  });

  $("#go-btn").onclick = () => handleSearch($("#search").value);
  $("#search").onkeydown = e => { if (e.key === "Enter") handleSearch(e.target.value); };

  $("#proxy-go").onclick = () => openProxy($("#proxy-input").value);
  $("#proxy-input").onkeydown = e => { if (e.key === "Enter") openProxy(e.target.value); };

  $$("[data-url]").forEach(a => {
    if (a.classList.contains("app")) {
      a.onclick = () => openProxy(a.dataset.url);
    }
  });

  $$("[data-proxy]").forEach(a => {
    a.onclick = () => openProxy(a.dataset.proxy);
  });

  $$("[data-bg]").forEach(b => b.onclick = () => setBg(b.dataset.bg));
  $$("[data-cloak]").forEach(b => b.onclick = () => setCloak(b.dataset.cloak));

  $("#name-input").onchange = e => {
    save("name", e.target.value);
    $("#username").textContent = e.target.value;
  };

  $("#panic-url").onchange = e => save("panic", e.target.value);

  $("#back-btn").onclick = closePlayer;
  $("#reload-btn").onclick = () => { $("#frame").src = current; };
  $("#newtab-btn").onclick = () => window.open(current, "_blank");

  document.addEventListener("keydown", e => {
    if (e.key === "]") {
      window.location.href = $("#panic-url").value || "https://classroom.google.com";
    }
  });
}

init();
</script>
</body>
</html>
