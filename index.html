<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --glass: rgba(15, 25, 45, 0.55);
    --glass-border: rgba(255,255,255,0.08);
    --text: #ffffff;
    --muted: rgba(255,255,255,0.55);
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    color: var(--text);
    overflow-x: hidden;
    background: #0c1a2e;
  }

  .bg {
    position: fixed;
    inset: 0;
    z-index: -2;
    background-size: cover;
    background-position: center;
    transition: opacity 0.8s ease;
  }

  .bg.mountain { background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1920&q=80'); }
  .bg.forest { background-image: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1920&q=80'); }
  .bg.lake { background-image: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1920&q=80'); }
  .bg.desert { background-image: url('https://images.unsplash.com/photo-1509316785289-025f5b846b35?w=1920&q=80'); }
  .bg.aurora { background-image: url('https://images.unsplash.com/photo-1531366936337-7c912a45b4d9?w=1920&q=80'); }
  .bg.ocean { background-image: url('https://images.unsplash.com/photo-1505142468610-359e7d316be0?w=1920&q=80'); }

  .overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(to bottom, rgba(8,15,30,0.4), rgba(8,15,30,0.65));
    z-index: -1;
  }

  /* Top bar */
  .topbar {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    background: var(--glass);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--glass-border);
    border-radius: 40px;
    padding: 5px 8px;
    z-index: 50;
  }

  .topbar button {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
  }

  .topbar button:hover,
  .topbar button.active {
    background: rgba(255,255,255,0.12);
    color: white;
  }

  .topbar button svg { width: 17px; height: 17px; }

  .profile {
    position: fixed;
    top: 16px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--glass);
    backdrop-filter: blur(18px);
    border: 1px solid var(--glass-border);
    border-radius: 40px;
    padding: 4px 12px 4px 4px;
    font-size: 13px;
    z-index: 50;
    cursor: pointer;
  }

  .profile img {
    width: 28px;
    height: 28px;
    border-radius: 50%;
  }

  /* Home */
  .center {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
  }

  .clock {
    font-size: clamp(64px, 11vw, 104px);
    font-weight: 300;
    letter-spacing: -2px;
    margin-bottom: 6px;
  }

  .greeting {
    font-size: 14.5px;
    color: var(--muted);
    margin-bottom: 32px;
  }

  .search-box {
    display: flex;
    align-items: center;
    background: var(--glass);
    backdrop-filter: blur(18px);
    border: 1px solid var(--glass-border);
    border-radius: 50px;
    padding: 5px 5px 5px 18px;
    width: 100%;
    max-width: 460px;
    transition: 0.2s;
  }

  .search-box:focus-within {
    border-color: rgba(255,255,255,0.22);
    box-shadow: 0 0 0 3px rgba(125,211,252,0.12);
  }

  .search-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 15px;
    padding: 10px 10px;
  }

  .search-box input::placeholder { color: var(--muted); }

  .search-box button {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.1);
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .search-box button:hover { background: rgba(255,255,255,0.18); }

  .apps {
    display: flex;
    gap: 12px;
    margin-top: 28px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .app {
    width: 46px;
    height: 46px;
    border-radius: 13px;
    background: var(--glass);
    backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    transition: 0.2s;
  }

  .app:hover {
    transform: translateY(-3px);
    background: rgba(255,255,255,0.14);
  }

  /* Pages */
  .page {
    display: none;
    min-height: 100vh;
    padding: 90px 36px 40px;
  }

  .page.active { display: block; }

  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .page-title {
    font-size: 26px;
    font-weight: 500;
  }

  .page-sub {
    color: var(--muted);
    font-size: 13.5px;
    margin-top: 3px;
  }

  .search-small {
    background: var(--glass);
    backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 10px 14px;
    color: white;
    font-size: 14px;
    outline: none;
    width: 240px;
  }

  .search-small::placeholder { color: var(--muted); }

  /* Games grid */
  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
    gap: 14px;
  }

  .game-card {
    background: var(--glass);
    backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.2s;
  }

  .game-card:hover {
    transform: translateY(-4px);
    border-color: rgba(255,255,255,0.2);
  }

  .game-card .thumb {
    height: 92px;
    background: linear-gradient(135deg, #1a2a3a, #0f1a28);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: rgba(255,255,255,0.25);
  }

  .game-card .name {
    padding: 11px 12px;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Settings */
  .settings-grid {
    display: grid;
    gap: 14px;
    max-width: 520px;
  }

  .setting {
    background: var(--glass);
    backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 16px 18px;
  }

  .setting label {
    display: block;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .options {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }

  .opt {
    padding: 7px 13px;
    border-radius: 9px;
    border: 1px solid var(--glass-border);
    background: transparent;
    color: white;
    font-size: 13px;
    cursor: pointer;
    transition: 0.2s;
  }

  .opt:hover, .opt.active {
    background: rgba(255,255,255,0.14);
    border-color: rgba(255,255,255,0.22);
  }

  .setting input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 9px;
    border: 1px solid var(--glass-border);
    background: rgba(0,0,0,0.25);
    color: white;
    font-size: 14px;
    outline: none;
  }

  /* Player */
  .player {
    position: fixed;
    inset: 0;
    background: #0a0a12;
    z-index: 100;
    display: none;
    flex-direction: column;
  }

  .player.active { display: flex; }

  .player-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: rgba(15,20,35,0.97);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .player-bar button {
    background: rgba(255,255,255,0.08);
    border: none;
    color: white;
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }

  .player-bar button:hover { background: rgba(255,255,255,0.14); }

  .player-title {
    flex: 1;
    font-size: 13.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .player iframe {
    flex: 1;
    border: none;
    width: 100%;
  }

  .count {
    color: var(--muted);
    font-size: 13px;
  }

  @media (max-width: 600px) {
    .clock { font-size: 60px; }
    .page { padding: 80px 16px 30px; }
    .search-small { width: 100%; }
  }
</style>
</head>

const PROXY = "https://uv.holyubofficial.net/service/";
const CLOAKS = {
  Home: { title: "Home", icon: null },
  Google: { title: "Google", icon: "https://www.google.com/favicon.ico" },
  Classroom: { title: "Classes", icon: "https://ssl.gstatic.com/classroom/favicon.ico" },
  Drive: { title: "My Drive", icon: "https://ssl.gstatic.com/docs/doclist/images/drive_2022q3_32dp.png" }
};

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
let current = "";

function save(k,v){ localStorage.setItem("nat_"+k,v); }
function load(k,f){ return localStorage.getItem("nat_"+k) || f; }

function updateClock() {
  const now = new Date();
  $("#clock").textContent = String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");
  const h = now.getHours();
  let g = "good evening";
  if (h < 12) g = "good morning";
  else if (h < 18) g = "good afternoon";
  const days = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
  const months = ["january","february","march","april","may","june","july","august","september","october","november","december"];
  $("#greeting").textContent = `${g} · ${days[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]}`;
}

function setBg(name) {
  $("#bg").className = "bg " + name;
  save("bg", name);
  $$("[data-bg]").forEach(b => b.classList.toggle("active", b.dataset.bg === name));
}

function setCloak(name) {
  const c = CLOAKS[name] || CLOAKS.Home;
  document.title = c.title;
  let link = document.querySelector("link[rel*='icon']") || document.createElement("link");
  link.rel = "icon";
  link.href = c.icon || "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔️</text></svg>";
  document.head.appendChild(link);
  save("cloak", name);
  $$("[data-cloak]").forEach(b => b.classList.toggle("active", b.dataset.cloak === name));
}

function showPage(id) {
  $$(".page").forEach(p => p.classList.remove("active"));
  $("#"+id).classList.add("active");
  $$(".topbar button").forEach(b => b.classList.toggle("active", b.dataset.page === id));
}

function openPlayer(url, title) {
  current = url;
  $("#player-title").textContent = title || url;
  $("#frame").src = url;
  $("#player").classList.add("active");
}

function closePlayer() {
  $("#player").classList.remove("active");
  $("#frame").src = "about:blank";
}

function openProxy(url) {
  if (!url.startsWith("http")) url = "https://" + url;
  openPlayer(PROXY + encodeURIComponent(url), url);
}

function renderGames(list) {
  $("#games-grid").innerHTML = list.map(g => `
    <div class="game-card" data-file="${g.file}" data-name="${g.name}">
      <div class="thumb">▶</div>
      <div class="name">${g.name}</div>
    </div>
  `).join("");
  $("#game-count").textContent = list.length;
  $$("#games-grid .game-card").forEach(c => {
    c.onclick = () => openPlayer("games/" + c.dataset.file, c.dataset.name);
  });
}

function handleSearch(val) {
  if (!val.trim()) return;
  if (val.includes(".") || val.startsWith("http")) openProxy(val);
  else openProxy("https://www.google.com/search?q=" + encodeURIComponent(val));
}

function init() {
  updateClock();
  setInterval(updateClock, 1000);

  setBg(load("bg","mountain"));
  setCloak(load("cloak","Home"));
  $("#username").textContent = load("name","atm");
  $("#name-input").value = load("name","atm");
  $("#panic-url").value = load("panic","https://classroom.google.com");

  renderGames(GAMES);

  $$(".topbar button").forEach(b => b.onclick = () => showPage(b.dataset.page));
  $("#go-btn").onclick = () => handleSearch($("#search").value);
  $("#search").onkeydown = e => { if (e.key === "Enter") handleSearch(e.target.value); };
  $("#proxy-go").onclick = () => openProxy($("#proxy-input").value);
  $("#proxy-input").onkeydown = e => { if (e.key === "Enter") openProxy(e.target.value); };

  $$("[data-url]").forEach(a => a.onclick = () => openProxy(a.dataset.url));
  $$("[data-proxy]").forEach(a => a.onclick = () => openProxy(a.dataset.proxy));
  $$("[data-bg]").forEach(b => b.onclick = () => setBg(b.dataset.bg));
  $$("[data-cloak]").forEach(b => b.onclick = () => setCloak(b.dataset.cloak));

  $("#name-input").onchange = e => {
    save("name", e.target.value);
    $("#username").textContent = e.target.value;
  };
  $("#panic-url").onchange = e => save("panic", e.target.value);

  $("#game-search").oninput = e => {
    const q = e.target.value.toLowerCase();
    renderGames(GAMES.filter(g => g.name.toLowerCase().includes(q)));
  };

  $("#back-btn").onclick = closePlayer;
  $("#reload-btn").onclick = () => $("#frame").src = current;
  $("#newtab-btn").onclick = () => window.open(current, "_blank");

  document.addEventListener("keydown", e => {
    if (e.key === "]") window.location.href = $("#panic-url").value || "https://classroom.google.com";
  });
}

init();
</script>
